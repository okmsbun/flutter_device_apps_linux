name: flutter_device_apps_linux
description: Flutter plugin for multi-source Linux app discovery (GIO, Flatpak, Snap, DPKG, RPM, Pacman, Nix, AppStream), launch, file handlers, and ELF technology detection.
version: 1.1.1

repository: https://github.com/okmsbun/flutter_device_apps_linux
issue_tracker: https://github.com/okmsbun/flutter_device_apps_linux/issues
topics:
  - installed-apps
  - app-management
  - linux

platforms:
  linux:

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  xml: ">=6.6.1 <8.0.0"

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: FlutterDeviceAppsLinuxPlugin
