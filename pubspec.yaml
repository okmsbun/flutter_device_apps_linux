name: flutter_device_apps_linux
description: List installed Linux desktop apps and read their display names and desktop file IDs from Flutter.
version: 0.0.1

repository: https://github.com/okmsbun/flutter_device_apps_linux
issue_tracker: https://github.com/okmsbun/flutter_device_apps_linux/issues

platforms:
  linux:

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: FlutterDeviceAppsLinuxPlugin
