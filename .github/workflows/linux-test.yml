name: Linux Tests

on:
  pull_request:
    branches: ["develop"]

permissions:
  contents: read

jobs:
  linux-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libgl1-mesa-dri shared-mime-info xvfb xauth

      - name: Install dependencies
        run: flutter pub get

      - name: Run native discovery unit tests
        run: |
          clang++ -std=c++14 -Wall -Wextra -Werror \
            -fsanitize=address,undefined \
            -Ilinux \
            linux/discovery/application_identity.cc \
            linux/discovery/application_discovery_service.cc \
            linux/discovery/legacy_list_apps_adapter.cc \
            linux/test/application_discovery_test.cc \
            -o /tmp/application_discovery_test
          /tmp/application_discovery_test

      - name: Run Linux integration tests
        run: bash example/tool/test_linux.sh
