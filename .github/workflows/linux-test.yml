name: Linux Tests

on:
  pull_request:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build and test dependencies
        run: |
          sudo apt-get update
          # Note: intentionally install flatpak and libappstream runtime shared
          # libraries without libflatpak-dev or libappstream-dev, proving the
          # plugin builds without compile-time or link-time headers.
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libgl1-mesa-dri shared-mime-info xvfb xauth flatpak
          sudo apt-get install -y libappstream5 || sudo apt-get install -y libappstream4

      - name: Install dependencies
        run: flutter pub get

      - name: Run native discovery unit tests (ASan/UBSan and TSan)
        run: |
          clang++ -std=c++14 -Wall -Wextra -Wpedantic -Werror \
            -pthread -fsanitize=address,undefined \
            -Ilinux \
            linux/discovery/application_identity.cc \
            linux/discovery/application_discovery_service.cc \
            linux/discovery/appstream_metadata_provider.cc \
            linux/discovery/async_discovery_runner.cc \
            linux/discovery/flatpak_discovery_provider.cc \
            linux/discovery/legacy_list_apps_adapter.cc \
            linux/discovery/snap_discovery_provider.cc \
            linux/discovery/snapd_socket_backend.cc \
            linux/test/application_discovery_test.cc \
            -o /tmp/application_discovery_test_asan
          /tmp/application_discovery_test_asan

          clang++ -std=c++14 -Wall -Wextra -Wpedantic -Werror \
            -pthread -fsanitize=thread \
            -Ilinux \
            linux/discovery/application_identity.cc \
            linux/discovery/application_discovery_service.cc \
            linux/discovery/appstream_metadata_provider.cc \
            linux/discovery/async_discovery_runner.cc \
            linux/discovery/flatpak_discovery_provider.cc \
            linux/discovery/legacy_list_apps_adapter.cc \
            linux/discovery/snap_discovery_provider.cc \
            linux/discovery/snapd_socket_backend.cc \
            linux/test/application_discovery_test.cc \
            -o /tmp/application_discovery_test_tsan
          /tmp/application_discovery_test_tsan

      - name: Run native GIO discovery integration tests
        run: |
          clang++ -std=c++14 -Wall -Wextra -Werror \
            -Ilinux \
            $(pkg-config --cflags gio-unix-2.0) \
            linux/discovery/application_identity.cc \
            linux/discovery/gio_discovery_provider.cc \
            linux/discovery/legacy_list_apps_adapter.cc \
            linux/test/gio_discovery_provider_test.cc \
            $(pkg-config --libs gio-unix-2.0) \
            -o /tmp/gio_discovery_provider_test

          empty_dir="$(mktemp -d)"
          fixture_dir="$(mktemp -d)"
          trap 'rm -rf -- "$empty_dir" "$fixture_dir"' EXIT

          mkdir -p "$empty_dir/applications" "$fixture_dir/applications"
          cat > "$fixture_dir/applications/org.example.VisibleFixture.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Visible Fixture
          Exec=/usr/bin/true %f
          EOF
          cat > "$fixture_dir/applications/org.example.NoDisplayFixture.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=NoDisplay Fixture
          Exec=/usr/bin/true %U
          NoDisplay=true
          Terminal=true
          EOF
          cat > "$fixture_dir/applications/org.example.OnlyShowInKdeFixture.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Only KDE Fixture
          Exec=/usr/bin/true
          OnlyShowIn=KDE;
          EOF
          cat > "$fixture_dir/applications/org.example.NotShowInGnomeFixture.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Not GNOME Fixture
          Exec=/usr/bin/true
          NotShowIn=GNOME;
          EOF
          cat > "$fixture_dir/applications/org.example.HiddenFixture.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Hidden Fixture
          Exec=/usr/bin/true
          Hidden=true
          EOF

          env XDG_DATA_HOME="$empty_dir" XDG_DATA_DIRS="$empty_dir" XDG_CURRENT_DESKTOP=GNOME LANGUAGE=C LC_ALL=C.UTF-8 \
            /tmp/gio_discovery_provider_test --empty
          env XDG_DATA_HOME="$fixture_dir" XDG_DATA_DIRS="$fixture_dir" XDG_CURRENT_DESKTOP=GNOME LANGUAGE=C LC_ALL=C.UTF-8 \
            /tmp/gio_discovery_provider_test

      - name: Run native Flatpak discovery integration tests
        run: |
          clang++ -std=c++14 -Wall -Wextra -Wpedantic -Werror \
            -Ilinux \
            $(pkg-config --cflags gio-unix-2.0 gmodule-2.0) \
            linux/discovery/application_identity.cc \
            linux/discovery/flatpak_discovery_provider.cc \
            linux/discovery/legacy_list_apps_adapter.cc \
            linux/discovery/libflatpak_backend.cc \
            linux/test/flatpak_discovery_provider_test.cc \
            $(pkg-config --libs gio-unix-2.0 gmodule-2.0) \
            -o /tmp/flatpak_discovery_provider_test

          # Verify no mandatory DT_NEEDED ELF dependency on libflatpak.
          if readelf -d /tmp/flatpak_discovery_provider_test | grep -q 'libflatpak'; then
            echo "Unexpected mandatory DT_NEEDED dependency on libflatpak"
            exit 1
          fi

          work_dir="$(mktemp -d)"
          trap 'sudo rm -rf -- "$work_dir"' EXIT

          # Test missing library and missing symbols with tiny stub shared libraries.
          printf '%s\n' 'void unrelated_symbol(void) {}' | \
            clang -x c - -fPIC -shared -o "$work_dir/libincomplete.so"
          cat > "$work_dir/core_only.c" <<'EOF'
          void* flatpak_get_system_installations(void* c, void** e) { (void)c; (void)e; return 0; }
          void* flatpak_installation_new_user(void* c, void** e) { (void)c; (void)e; return 0; }
          void* flatpak_installation_list_installed_refs_by_kind(void* s, int k, void* c, void** e) { (void)s; (void)k; (void)c; (void)e; return 0; }
          const char* flatpak_installation_get_id(void* s) { (void)s; return "default"; }
          int flatpak_installation_get_is_user(void* s) { (void)s; return 0; }
          const char* flatpak_ref_get_name(void* r) { (void)r; return 0; }
          const char* flatpak_ref_get_arch(void* r) { (void)r; return 0; }
          const char* flatpak_ref_get_branch(void* r) { (void)r; return 0; }
          int flatpak_ref_get_kind(void* r) { (void)r; return 0; }
          EOF
          clang "$work_dir/core_only.c" -fPIC -shared -o "$work_dir/libcoreonly.so"

          /tmp/flatpak_discovery_provider_test --missing-lib
          /tmp/flatpak_discovery_provider_test --missing-symbols \
            "$work_dir/libincomplete.so" "$work_dir/libcoreonly.so"

          # Build an offline local Flatpak repo with one runtime and one app
          # (intentionally without any .desktop file), matching upstream
          # flatpak build-export / make-test-runtime.sh directory expectations.
          arch="$(flatpak --default-arch)"
          mkdir -p "$work_dir/rt/usr/bin" "$work_dir/rt/files" \
            "$work_dir/app/files/bin" "$work_dir/app/var" \
            "$work_dir/user" "$work_dir/system" "$work_dir/extra" "$work_dir/etc/installations.d"

          cat > "$work_dir/rt/metadata" <<EOF
          [Runtime]
          name=org.example.Runtime
          runtime=org.example.Runtime/$arch/1.0
          sdk=org.example.Runtime/$arch/1.0
          EOF
          flatpak build-export --runtime "$work_dir/repo" "$work_dir/rt" 1.0

          printf '#!/bin/sh\nexit 0\n' > "$work_dir/app/files/bin/true"
          chmod +x "$work_dir/app/files/bin/true"
          cat > "$work_dir/app/metadata" <<EOF
          [Application]
          name=org.example.NoDesktopApp
          runtime=org.example.Runtime/$arch/1.0
          sdk=org.example.Runtime/$arch/1.0
          EOF
          flatpak build-finish --command=true "$work_dir/app"
          flatpak build-export "$work_dir/repo" "$work_dir/app" stable

          cat > "$work_dir/etc/installations.d/extra.conf" <<EOF
          [Installation "extra"]
          Path=$work_dir/extra
          DisplayName=Extra System Installation
          StorageType=harddisk
          EOF

          export FLATPAK_USER_DIR="$work_dir/user"
          export FLATPAK_SYSTEM_DIR="$work_dir/system"
          export FLATPAK_CONFIG_DIR="$work_dir/etc"

          flatpak remote-add --user --no-gpg-verify local "file://$work_dir/repo"
          flatpak install --user -y --noninteractive --no-deps --no-related \
            local "runtime/org.example.Runtime/$arch/1.0"
          flatpak install --user -y --noninteractive --no-deps --no-related \
            local "app/org.example.NoDesktopApp/$arch/stable"

          sudo FLATPAK_SYSTEM_DIR="$work_dir/system" FLATPAK_CONFIG_DIR="$work_dir/etc" \
            flatpak remote-add --system --no-gpg-verify local "file://$work_dir/repo"
          sudo FLATPAK_SYSTEM_DIR="$work_dir/system" FLATPAK_CONFIG_DIR="$work_dir/etc" \
            flatpak install --system -y --noninteractive --no-deps --no-related \
            local "app/org.example.NoDesktopApp/$arch/stable"

          sudo FLATPAK_SYSTEM_DIR="$work_dir/system" FLATPAK_CONFIG_DIR="$work_dir/etc" \
            flatpak remote-add --installation=extra --no-gpg-verify local "file://$work_dir/repo"
          sudo FLATPAK_SYSTEM_DIR="$work_dir/system" FLATPAK_CONFIG_DIR="$work_dir/etc" \
            flatpak install --installation=extra -y --noninteractive --no-deps --no-related \
            local "app/org.example.NoDesktopApp/$arch/stable"

          sudo chmod -R a+rX "$work_dir/system" "$work_dir/extra"
          /tmp/flatpak_discovery_provider_test --fixture

      - name: Run native AppStream metadata integration tests
        run: |
          clang++ -std=c++14 -Wall -Wextra -Wpedantic -Werror \
            -Ilinux \
            $(pkg-config --cflags gio-unix-2.0 gmodule-2.0) \
            linux/discovery/application_discovery_service.cc \
            linux/discovery/appstream_metadata_provider.cc \
            linux/discovery/libappstream_backend.cc \
            linux/test/appstream_metadata_provider_test.cc \
            $(pkg-config --libs gio-unix-2.0 gmodule-2.0) \
            -o /tmp/appstream_metadata_provider_test

          # Verify no mandatory DT_NEEDED ELF dependency on libappstream.
          if readelf -d /tmp/appstream_metadata_provider_test | grep -q 'libappstream'; then
            echo "Unexpected mandatory DT_NEEDED dependency on libappstream"
            exit 1
          fi

          as_dir="$(mktemp -d)"
          trap 'rm -rf -- "$as_dir"' EXIT

          printf '%s\n' 'void unrelated_symbol(void) {}' | \
            clang -x c - -fPIC -shared -o "$as_dir/libincomplete.so"
          cat > "$as_dir/mismatched_v5.c" <<'EOF'
          void* as_pool_new(void) { return 0; }
          int as_pool_load(void* p, void* c, void** e) { (void)p; (void)c; (void)e; return 0; }
          void* as_pool_get_components(void* p) { (void)p; return 0; }
          const char* as_component_get_id(void* c) { (void)c; return 0; }
          EOF
          clang "$as_dir/mismatched_v5.c" -fPIC -shared -o "$as_dir/libappstream.so.5"

          /tmp/appstream_metadata_provider_test --missing-lib
          /tmp/appstream_metadata_provider_test --unsupported-abi \
            "$as_dir/libincomplete.so" "$as_dir/libappstream.so.5"

          mkdir -p "$as_dir/metainfo" "$as_dir/catalog"
          cat > "$as_dir/metainfo/org.example.Editor.metainfo.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>org.example.Editor</id>
            <name>Example Editor</name>
            <name xml:lang="tr">Örnek Editör</name>
            <summary>Text editor</summary>
            <summary xml:lang="tr">Metin düzenleyici</summary>
            <description><p>Simple editor.</p></description>
            <project_license>MIT</project_license>
            <url type="homepage">https://example.org/editor</url>
            <launchable type="desktop-id">org.example.Editor.desktop</launchable>
            <categories><category>Utility</category></categories>
            <releases>
              <release version="3.1.0" date="2026-10-01"/>
            </releases>
          </component>
          EOF
          cat > "$as_dir/metainfo/malformed.metainfo.xml" <<'EOF'
          <component ! broken xml
          EOF
          cat > "$as_dir/catalog/example-catalog.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <components version="0.16" origin="example-distro">
            <component type="console-application">
              <id>org.example.CliTool</id>
              <pkgname>example-cli</pkgname>
              <name>CLI Tool</name>
              <summary>Command line utility</summary>
              <bundle type="flatpak">app/org.example.CliTool/x86_64/stable</bundle>
            </component>
          </components>
          EOF

          /tmp/appstream_metadata_provider_test --fixture "$as_dir/metainfo" "$as_dir/catalog"

      - name: Run Linux integration tests
        run: bash example/tool/test_linux.sh
