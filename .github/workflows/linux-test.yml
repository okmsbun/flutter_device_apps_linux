name: Linux Tests

on:
  pull_request:
    branches: ["develop"]

permissions:
  contents: read

jobs:
  linux-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev shared-mime-info xvfb xauth

      - name: Install dependencies
        run: flutter pub get

      - name: Run Linux integration tests
        run: bash example/tool/test_linux.sh
